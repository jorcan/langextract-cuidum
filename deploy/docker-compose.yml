# LangExtract web — docker-compose BASE (portable a cualquier host).
#
# - En LOCAL (este host):   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.local up -d
#   → escucha solo en 127.0.0.1:8654 (acceso por túnel SSH o nginx local).
#
# - En PROD-A (VPS/Traefik):  docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.traefik.yml --env-file deploy/.env up -d
#   → se une a la red traefik-public y Traefik lo publica con HTTPS + host.
#
# Migrar = copiar deploy/ + .env y cambiar el override. Mismo código, misma imagen.

services:
  langextract:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: langextract-web:1.0.0
    container_name: langextract-web
    environment:
      API_TOKEN: ${API_TOKEN:?API_TOKEN no definido en el .env}
      N8N_DB_URL: ${N8N_DB_URL:?N8N_DB_URL no definido en el .env}
      CUIDUM_DB_URL: ${CUIDUM_DB_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY no definido en el .env}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      PORT: "8654"
    ports:
      - "127.0.0.1:8654:8654"
    volumes:
      - langextract-out:/app/data/output
    restart: unless-stopped
    networks:
      - app-net

volumes:
  langextract-out:

networks:
  app-net:
    driver: bridge